<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100204">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Nightstand">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Nightstand</title>
<style>
:root{color-scheme:dark;--bg:#100204;--face:#190507;--rim:#4c1118;--fg:#d66a72;--muted:#85343e;--accent:#ef8b91}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--fg);-webkit-font-smoothing:antialiased;user-select:none}
.screen{position:relative;width:100%;height:100%;height:100dvh;display:grid;place-items:center;padding:env(safe-area-inset-top) 5vw env(safe-area-inset-bottom);background:radial-gradient(ellipse at 50% 46%,#26090e 0%,#100204 66%);transition:background .7s}
.content{width:min(100%,900px);display:flex;flex-direction:column;align-items:center;gap:clamp(18px,4vh,38px);transform:translateY(-1vh)}
.date{font-size:clamp(12px,1.8vw,16px);font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.clock{width:min(64vh,70vw,590px);height:min(64vh,70vw,590px);min-width:260px;min-height:260px;max-width:calc(100vw - 40px);max-height:calc(100vw - 40px);aspect-ratio:1;position:relative;border-radius:50%;background:radial-gradient(circle at 50% 45%,#26090e 0%,var(--face) 72%);border:1px solid var(--rim);box-shadow:0 0 0 7px #21070b,0 0 0 8px #4a1118,0 25px 90px #0008,inset 0 0 42px #080102}
.clock:before{content:"";position:absolute;inset:4.5%;border:1px solid #5c1b23;border-radius:50%;opacity:.55}
.tick{position:absolute;left:50%;top:5.8%;width:1px;height:7%;background:#8d3a43;transform-origin:50% 635%;opacity:.72}
.tick.major{width:3px;height:9%;top:4.5%;background:#d36a73;opacity:.9}
.numeral{position:absolute;left:50%;top:50%;font-size:clamp(17px,3.4vh,27px);font-weight:400;letter-spacing:.04em;color:#c65c67;transform:translate(-50%,-50%);font-variant-numeric:tabular-nums}
.hand{position:absolute;left:50%;bottom:50%;transform-origin:50% 100%;border-radius:99px;z-index:3}
.hour{width:7px;height:25%;background:#e18a8e;box-shadow:0 0 10px #d95d6a35}
.minute{width:4px;height:36%;background:#d96b75;box-shadow:0 0 12px #d95d6a30}
.second{width:1.5px;height:39%;background:#f09a9d;z-index:4}
.pin{position:absolute;left:50%;top:50%;width:13px;height:13px;border-radius:50%;background:#f1a0a2;transform:translate(-50%,-50%);z-index:5;box-shadow:0 0 12px #e66c7833}
.clock-label{position:absolute;left:50%;top:68%;transform:translateX(-50%);font-size:9px;letter-spacing:.34em;text-transform:uppercase;color:#74303a;white-space:nowrap}
.toolbar{position:absolute;right:max(18px,env(safe-area-inset-right));bottom:max(16px,env(safe-area-inset-bottom));display:flex;align-items:center;gap:10px}
.status{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:#71313a}
button{font:inherit;color:#a44a54;background:#1a0609;border:1px solid #54202a;border-radius:50%;width:42px;height:42px;display:grid;place-items:center;cursor:pointer}
button:active{background:#310c12}
button svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.5}
.panel{position:absolute;right:max(16px,env(safe-area-inset-right));bottom:max(70px,calc(env(safe-area-inset-bottom) + 62px));width:min(310px,calc(100vw - 32px));padding:22px;background:#1b070a;border:1px solid #59202a;border-radius:18px;box-shadow:0 18px 60px #000b;text-align:left;display:none;z-index:6}
.panel.open{display:block}
.panel h2{font-size:12px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;color:#df8289;margin:0 0 18px}
.setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid #ffffff12;font-size:14px;color:#d5a0a3}
.setting small{display:block;color:#98616a;font-size:11px;margin-top:3px;line-height:1.4}
.setting input[type=checkbox]{accent-color:#c95d68;width:18px;height:18px}
.setting input[type=range]{width:112px;accent-color:#c95d68}
.notice{font-size:11px;line-height:1.5;color:#a06a72;margin:14px 0 0}
.dim-layer{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;z-index:5}
@media (orientation:portrait){.content{gap:clamp(18px,4vh,30px)}.clock{width:min(70vw,52vh,520px);height:auto}}
@media (orientation:landscape){.content{flex-direction:row;justify-content:center;gap:clamp(34px,7vw,90px)}.date{position:absolute;top:7vh;left:50%;transform:translateX(-50%)}.clock{width:min(68vh,46vw,560px);height:auto}}
@media (max-height:430px){.clock{width:min(78vh,42vw,360px);height:auto}.date{top:3vh}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main class="screen" id="screen">
<section class="content" aria-label="Analog bedside clock">
<div class="date" id="date">Sunday, November 8</div>
<div class="clock" id="clock" role="img" aria-label="Analog clock">
<div id="ticks"></div>
<div class="numeral" style="left:50%;top:17%">12</div>
<div class="numeral" style="left:83%;top:50%">3</div>
<div class="numeral" style="left:50%;top:83%">6</div>
<div class="numeral" style="left:17%;top:50%">9</div>
<div class="hand hour" id="hourHand"></div>
<div class="hand minute" id="minuteHand"></div>
<div class="hand second" id="secondHand"></div>
<div class="pin"></div>
<div class="clock-label">Nightstand</div>
</div>
</section>
<div class="toolbar">
<span class="status" id="wakeStatus">Ready</span>
<button id="settingsButton" aria-label="Settings" aria-expanded="false">
<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-1.7 2.94-.09-.03a1.7 1.7 0 0 0-1.8.3l-.07.06h-3.4l-.03-.1a1.7 1.7 0 0 0-1.3-1.2l-.1-.02-1.7-2.94.06-.08a1.7 1.7 0 0 0 .18-1.82l-.04-.09v-3.4l.1-.03a1.7 1.7 0 0 0 1.2-1.3l.02-.1 2.94-1.7.08.06a1.7 1.7 0 0 0 1.82.18l.09-.04h3.4l.03.1a1.7 1.7 0 0 0 1.3 1.2l.1.02 1.7 2.94-.06.08a1.7 1.7 0 0 0-.18 1.82l.04.09z" transform="translate(-2 -2) scale(.9)"/></svg>
</button>
</div>
<aside class="panel" id="panel" aria-label="Clock settings">
<h2>Nightstand settings</h2>
<label class="setting"><span>Sweep second hand</span><input id="showSeconds" type="checkbox" checked></label>
<label class="setting"><span>Keep display awake<small>Requires browser support</small></span><input id="keepAwake" type="checkbox"></label>
<label class="setting"><span>Screen dimmer</span><input id="brightness" type="range" min="0" max="85" value="0"></label>
<p class="notice" id="wakeNotice">The clock uses your iPad's local time. Keep the iPad connected to power for overnight use.</p>
</aside>
</main>
<div class="dim-layer" id="dimLayer"></div>
<script>
const $=id=>document.getElementById(id);
const defaults={showSeconds:true,keepAwake:false,brightness:0};
let settings={...defaults};
try{settings={...defaults,...JSON.parse(localStorage.getItem('nightstand-settings')||'{}')}}catch{}
let wakeLock=null;
const save=()=>localStorage.setItem('nightstand-settings',JSON.stringify(settings));
for(let i=0;i<60;i++){const mark=document.createElement('i');mark.className='tick'+(i%5===0?' major':'');mark.style.transform='translateX(-50%) rotate('+i*6+'deg)';$('ticks').appendChild(mark)}
function tick(){
 const now=new Date(),ms=now.getMilliseconds(),sec=now.getSeconds()+ms/1000,min=now.getMinutes()+sec/60,hour=(now.getHours()%12)+min/60;
 $('date').textContent=new Intl.DateTimeFormat(undefined,{weekday:'long',month:'long',day:'numeric'}).format(now);
 $('hourHand').style.transform='translateX(-50%) rotate('+hour*30+'deg)';
 $('minuteHand').style.transform='translateX(-50%) rotate('+min*6+'deg)';
 $('secondHand').style.display=settings.showSeconds?'block':'none';
 $('secondHand').style.transform='translateX(-50%) rotate('+sec*6+'deg)';
}
async function setWakeLock(enabled){
 settings.keepAwake=enabled;save();
 if(!enabled){if(wakeLock){await wakeLock.release();wakeLock=null}$('wakeStatus').textContent='Ready';return}
 if(!('wakeLock'in navigator)){$('keepAwake').checked=false;settings.keepAwake=false;save();$('wakeStatus').textContent='Wake lock unavailable';$('wakeNotice').textContent='This browser does not support Screen Wake Lock. iPadOS may sleep normally.';return}
 try{wakeLock=await navigator.wakeLock.request('screen');$('wakeStatus').textContent='Display awake';$('wakeNotice').textContent='Screen Wake Lock is active while this page is visible.';wakeLock.addEventListener('release',()=>{wakeLock=null;$('wakeStatus').textContent='Wake lock released'})}
 catch(e){$('wakeStatus').textContent='Wake lock unavailable';$('wakeNotice').textContent='iPadOS did not grant a screen wake lock.'}
}
$('settingsButton').addEventListener('click',()=>{const open=$('panel').classList.toggle('open');$('settingsButton').setAttribute('aria-expanded',String(open))});
$('showSeconds').checked=settings.showSeconds;
$('showSeconds').addEventListener('change',e=>{settings.showSeconds=e.target.checked;save();tick()});
$('keepAwake').checked=settings.keepAwake;
$('keepAwake').addEventListener('change',e=>setWakeLock(e.target.checked));
$('brightness').value=settings.brightness;
$('dimLayer').style.opacity=settings.brightness/100;
$('brightness').addEventListener('input',e=>{settings.brightness=Number(e.target.value);$('dimLayer').style.opacity=settings.brightness/100;save()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&settings.keepAwake)setWakeLock(true)});
tick();setInterval(tick,200);
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body>
</html>
